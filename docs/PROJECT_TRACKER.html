  header.top {

  .sub { color:var(--muted); font-size:14px; }
  .meta { margin-top:14px; font-size:13px; color:var(--muted); }

  .progress-bar { height:100%; background:linear-gradient(90deg,#3fb950,#5b9dff);

  .progress-label { margin-top:8px; font-size:13px; color:var(--muted); }

  .legend { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 8px; font-size:12px; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:3px 10px;
    border-radius:99px; font-weight:600; font-size:11.5px; letter-spacing:.2px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .st-todo{background:#4b556322;color:var(--todo);} .st-todo .dot{background:var(--todo);}
  .st-doing{background:#d9a44122;color:var(--doing);} .st-doing .dot{background:var(--doing);}
  .st-done{background:#3fb95022;color:var(--done);} .st-done .dot{background:var(--done);}
  .st-blocked{background:#f04f4f22;color:var(--blocked);} .st-blocked .dot{background:var(--blocked);}

  .owner { padding:2px 9px; border-radius:6px; font-size:11px; font-weight:700; }
  .ow-Lead{background:#a371f722;color:var(--lead);}
  .ow-Backend{background:#5b9dff22;color:var(--backend);}
  .ow-AI-Engine{background:#3fb0a822;color:var(--ai);}
  .ow-Frontend{background:#f778ba22;color:var(--frontend);}

  .phase { margin-top:30px; }
  .phase-h { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .phase-h h2 { margin:0; font-size:17px; }
  .phase-h .count { font-size:12px; color:var(--muted); }

  .epic { background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:12px; }
  .epic-h { display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:6px; }
  .epic-h .name { font-weight:700; font-size:14px; }
  .epic-h .eid { color:var(--muted); font-weight:600; font-size:12px; margin-right:6px; }
  .stories { display:flex; flex-direction:column; gap:2px; margin-top:8px; }
  .story { display:flex; align-items:center; gap:12px; padding:7px 8px; border-radius:8px; }
  .story:hover { background:var(--panel2); }
  .story .sid { color:var(--muted); font-size:12px; font-weight:600; min-width:44px; }
  .story .desc { flex:1; font-size:13.5px; }
  .story.done .desc { color:var(--muted); }
  footer { margin-top:40px; color:var(--muted); font-size:12px; text-align:center; }

const LABELS = { todo:"Not started", doing:"In progress", done:"Done", blocked:"Blocked" };

function render() {
  let total=0, done=0;
  const board = document.getElementById("board");
  board.innerHTML = "";
  for (const ph of DATA.phases) {
    let pTotal=0, pDone=0;
    const sec = document.createElement("div"); sec.className="phase";
    const hh = document.createElement("div"); hh.className="phase-h";
    const h2 = document.createElement("h2"); h2.textContent = ph.name;
    const cnt = document.createElement("span"); cnt.className="count";
    hh.appendChild(h2); hh.appendChild(cnt); sec.appendChild(hh);
    for (const ep of ph.epics) {
      const ec = document.createElement("div"); ec.className="epic";
      const eh = document.createElement("div"); eh.className="epic-h";
      eh.innerHTML = `<div><span class="eid">${ep.id}</span><span class="name">${ep.name}</span></div>`;
      ec.appendChild(eh);
      const sl = document.createElement("div"); sl.className="stories";
      for (const st of ep.stories) {
        total++; pTotal++;
        if (st.status==="done"){done++; pDone++;}
        const row = document.createElement("div");
        row.className = "story" + (st.status==="done"?" done":"");
        row.innerHTML =
          `<span class="sid">${st.id}</span>
           <span class="desc">${st.desc}</span>
           <span class="owner ow-${st.owner}">${st.owner}</span>
           <span class="pill st-${st.status}"><span class="dot"></span>${LABELS[st.status]}</span>`;
        sl.appendChild(row);
      }
      ec.appendChild(sl); sec.appendChild(ec);
    }
    cnt.textContent = `${pDone}/${pTotal} done`;
    board.appendChild(sec);
  }
  const pct = total? Math.round(done/total*100):0;
  document.getElementById("bar").style.width = pct+"%";
  document.getElementById("plabel").textContent = `${done} of ${total} stories complete (${pct}%)`;
  document.getElementById("meta").textContent = "Last updated: " + DATA.lastUpdated;
}
render();
</script>
